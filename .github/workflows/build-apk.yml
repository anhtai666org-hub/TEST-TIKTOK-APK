name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Tiktok 47.1.4 Edited × Android TV.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TV-Hybrid-APK
          path: "Tiktok 47.1.4 Edited × Android TV.apk"
          if-no-files-found: error
